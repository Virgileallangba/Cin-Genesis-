<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINÉ-GENESIS v2.0 · Studio de films IA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--p:#fff;--ink:#0b1a2b;--dim:#6b7c93;--ln:#d5deea;--a:#0a84ff;--b:#ff5a1f;--ok:#12b76a;--er:#e5383b;--m:'Share Tech Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Rajdhani,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:70px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/40px 40px;opacity:.5}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ink);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.logo{font:800 20px Orbitron;letter-spacing:.1em}.logo b{color:var(--a)}.logo i{display:block;font:10px var(--m);letter-spacing:.3em;color:var(--dim);font-style:normal}
#steps{display:flex;gap:4px;flex-wrap:wrap}
.st{font:11px var(--m);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--ln);background:#fff;color:var(--dim)}
.st.ok{color:var(--ink);border-color:var(--ink)}.st.on{background:var(--ink);color:#fff;border-color:var(--ink)}.st:disabled{opacity:.45}
.hb{display:flex;gap:6px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:22px 16px}
.hero{background:var(--p);border:1px solid var(--ln);padding:22px;margin-bottom:16px;position:relative}
.hero::before,.hero::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--a)}
.hero::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.hero::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.lab{font:11px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h2{font:600 28px Orbitron;letter-spacing:.04em;margin:6px 0 8px}h2 b{color:var(--a)}h3{font:600 15px Orbitron;letter-spacing:.06em;margin:16px 0 4px}
p.sub{color:var(--dim);margin-bottom:12px;max-width:780px}
.guide{display:flex;gap:12px;align-items:center;border:1px solid var(--a);background:#eef6ff;padding:12px 14px;margin:10px 0 16px}
.guide.go{border-color:var(--ok);background:#effaf4}.guide.er{border-color:var(--er);background:#fff1f1;display:block}.guide.wt{border-color:var(--b);background:#fff6f0}
textarea,input[type=text],select{width:100%;font:13px var(--m);padding:9px;border:1px solid var(--ln);background:#f9fbfd;color:var(--ink);outline:0}
textarea:focus,input:focus,select:focus{border-color:var(--a);background:#fff}textarea{resize:vertical;min-height:70px;margin:4px 0}
label.f{display:block;margin:6px 0}label.f span{display:block}
button,.btn{font:600 12px var(--m);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:inline-block}
button:hover:not(:disabled),.btn:hover{background:var(--ink);color:#fff}button:disabled{opacity:.35;cursor:not-allowed}
.big{background:var(--a);border-color:var(--a);color:#fff;padding:14px 26px;font-size:14px;letter-spacing:.16em}.big:hover:not(:disabled){background:#0066cc}
.sm{padding:5px 9px;font-size:10px}.ft{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chip{font:11px var(--m);padding:2px 8px;border:1px solid var(--ok);color:var(--ok)}.chip.off{border-color:var(--er);color:var(--er)}
.gc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.gc button.sel{background:var(--a);border-color:var(--a);color:#fff}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:10px 0}
.ch{border:1px solid var(--ink);padding:16px;cursor:pointer;background:#fff}.ch:hover{background:#f3f8ff}.ch.sel{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a);background:#eef6ff}.ch b{display:block;font:600 15px Orbitron;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cd{border:1px solid var(--ln);background:#fff;padding:10px;position:relative}.cd.pk{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.im{position:relative;background:#e8eef6;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px;font:11px var(--m);color:var(--dim)}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp,.sp2{border:2px solid var(--a);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite}.sp{position:absolute;width:26px;height:26px;z-index:2}.sp2{display:inline-block;width:16px;height:16px;flex:none}@keyframes r{to{transform:rotate(360deg)}}
.ip{background:#f6f9fc;border:1px solid var(--ln);padding:8px;margin:6px 0}.rw{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.up{border:1px solid var(--ink);cursor:pointer}
.bar{height:6px;background:var(--ln);margin:12px 0}.bar i{display:block;height:100%;background:var(--a);width:0;transition:width .4s}
.feed{margin:10px 0}.fi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:16px}.fi.ok{color:var(--ok)}.fi.er{color:var(--er)}.fi em{margin-left:auto;font:11px var(--m);color:var(--dim);font-style:normal}.fi .ic{width:18px;text-align:center;flex:none}
.mg{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}.mn .im{margin:0}.mn .lab{font-size:9px;padding-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lad{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.lad i{font:11px var(--m);font-style:normal;padding:3px 8px;border:1px solid var(--ln);color:var(--dim)}.lad i.past{border-color:var(--b);color:var(--b)}.lad i.on{background:var(--b);color:#fff;border-color:var(--b)}
.tl{border:1px solid var(--ln);background:#fff}.tl.ok{border-color:var(--ok)}.tl.run{border-color:var(--a)}.tl.er{border-color:var(--er)}
.th{position:relative;background:#e8eef6;overflow:hidden}.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;top:4px;left:4px;z-index:2;font:10px var(--m);background:var(--ink);color:#fff;padding:1px 5px}.nw{position:absolute;top:4px;right:4px;z-index:2;font:10px var(--m);font-style:normal;background:var(--b);color:#fff;padding:1px 5px}
.tx{font-size:13px;padding:6px 8px;line-height:1.3}.mt{font:10px var(--m);color:var(--dim);padding:0 8px 7px}
.kp{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}.kp b{font:600 22px Orbitron;display:block}
#con{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:50;background:#0b1a2b;color:#bfe3ff;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}#con.on{transform:none}
#lb{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 var(--m)}.lg.er{color:#ff8a8a}.lg.wr{color:#ffc477}.lg.ok{color:#7dffb5}
#md{position:fixed;inset:0;background:rgba(11,26,43,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}#md.on{display:flex}#md>div{background:#fff;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px;border:1px solid var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}#toast div{background:var(--ink);color:#fff;font:12px var(--m);padding:8px 14px}
#pl{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}#pl.on{display:flex}#pv,#pi{max-width:100vw;max-height:100vh}#sub{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;color:#fff;font:600 22px/1.3 Rajdhani;text-shadow:0 2px 8px #000}#pl button{position:absolute;top:14px;right:14px}
#exportModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--m)}
#exportModal.on{display:flex}
#exportCanvas{max-width:90vw;max-height:60vh;border:2px solid var(--a);margin-bottom:20px;background:#000;}
@media(max-width:700px){h2{font-size:21px}.st{padding:4px 6px;font-size:9px}}
</style></head><body>

<header>
  <div class="logo">CINÉ<b>-GENESIS</b><i>STUDIO DE FILMS IA · V2.0</i></div>
  <nav id="steps"></nav>
  <div class="hb">
    <button class="sm" data-a="share">🔗 Partager</button>
    <span class="chip" id="qchip"></span>
    <button class="sm" data-a="sess">Mes films</button>
    <button class="sm" data-a="con">Journal</button>
  </div>
</header>

<main id="main"></main>

<div id="con"><div style="display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #26405c;font:12px var(--m)"><span>JOURNAL TECHNIQUE</span><button class="sm" data-a="con" style="color:#bfe3ff;border-color:#4a6a8a">✕</button></div><div id="lb"></div></div>
<div id="md"><div id="mdc"></div></div><div id="toast"></div>

<div id="pl">
  <video id="pv" playsinline style="display:none"></video>
  <img id="pi" alt="" style="display:none">
  <div id="sub"></div>
  <button data-a="stopplay">✕ Quitter</button>
</div>

<div id="exportModal">
  <h2 id="exp-title" style="color:#fff;margin-bottom:10px;">Assemblage du film en cours...</h2>
  <p id="exp-desc" style="margin-bottom:20px;color:#aaa;">Ne fermez pas cette fenêtre. L'export inclut les sous-titres et le son.</p>
  <canvas id="exportCanvas" width="1280" height="720"></canvas>
  <div class="bar" style="width:80%;max-width:600px;"><i id="exp-pgb" style="width:0%"></i></div>
  <button data-a="closeexport" style="margin-top:20px;" id="exp-btn-close">Annuler</button>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════════
   1. CONFIG & VARIABLES GLOBALES (Déclarées en premier)
   ═════════════════════════════════════════════════════════════════════ */
const PROVIDERS = {
  xai: { name: 'xAI Grok', api: 'https://api.x.ai/v1', txt: ['grok-4.6','grok-3'], img: 'grok-imagine-image-2.0', vid: 'grok-imagine-video-1.5' },
  openai: { name: 'OpenAI', api: 'https://api.openai.com/v1', txt: ['gpt-4o','gpt-4-turbo'], img: 'dall-e-3', vid: null },
  runway: { name: 'Runway (Vidéo)', api: 'https://api.dev.runwayml.com/v1', txt: null, img: null, vid: 'gen3a_turbo' }
};
const RPM={img:20,vid:2,txt:60};
const STEPS=['Clés','Genre','Synopsis','Personnages','Scènes','Plans','Vidéos'];
const BACK=[3,6,12,24,48,96];
const G=[['Fiction',["Court-métrage|arthouse","Drame|naturalistic","Comédie|warm","Thriller|low-key","Sci-Fi|futuristic","Horreur|dark"]]];

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...');

let db=null;
let P=null;
let Q=null;
let page=0;
let F=1;
let playing=false;
let TASK=null;

const KEYS={list:[],plan:'standard'};
const AR=()=>(P?P.ratio:'16:9').replace(':','/');
const ref=i=>i&&(i.d||i.u);
const mkKey=k=>({k,img:0,vid:0,txt:0,cool:0,bad:0,off:false});

/* ═════════════════════════════════════════════════════════════════════
   2. STOCKAGE
   ═════════════════════════════════════════════════════════════════════ */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cinegenesis_v2',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'})}})}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
let mode='idb';
const mem={sessions:{},config:{}};
const lsK=(s,k)=>'cg2_'+s+'_'+k;
function fall(e){if(mode=='idb'){mode='ls';log('wr','IndexedDB indisponible → stockage de secours');}}
async function dbGet(s,k){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.get(k))}catch(e){fall(e)}}try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v)}catch(e){}return mem[s][k]}
async function dbPut(s,v){const k=v.key||v.id;mem[s][k]=v;if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.put(v))}catch(e){fall(e)}}try{localStorage.setItem(lsK(s,k),JSON.stringify(v))}catch(e){}}
async function dbDel(s,k){delete mem[s][k];if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.delete(k))}catch(e){fall(e)}}try{localStorage.removeItem(lsK(s,k))}catch(e){}}
async function dbAll(s){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.getAll())}catch(e){fall(e)}}return Object.values(mem[s]||{})}
let svT;
function save(){if(!P)return;clearTimeout(svT);svT=setTimeout(()=>{P.upd=Date.now();dbPut('sessions',P).catch(e=>log('er','sauvegarde : '+e.message))},350)}

/* ═════════════════════════════════════════════════════════════════════
   3. LOG / TOAST
   ═════════════════════════════════════════════════════════════════════ */
function log(l,m){const d=document.createElement('div');d.className='lg '+l;d.textContent=new Date().toLocaleTimeString()+'  '+m;const b=$('#lb');if(!b)return;b.appendChild(d);while(b.children.length>400)b.firstChild.remove();b.scrollTop=b.scrollHeight}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}

/* ═════════════════════════════════════════════════════════════════════
   4. PLANIFICATEUR MULTI-CLÉS
   ═════════════════════════════════════════════════════════════════════ */
async function slot(kind){
  for(;;){
    if(TASK&&TASK.stop)throw new Error('stop');
    const live=KEYS.list.filter(o=>!o.off);
    if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const iv=60000/RPM[kind]*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){const t=Math.max(o[kind]||0,o.cool||0,now);if(t<bt){bt=t;best=o}}
    if(bt>now){await sleep(Math.min(bt-now,400));continue}
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;return best;
  }
}
async function call(kind,url,body,tries,provider){
  let err;
  for(let a=0;a<tries;a++){
    const o=await slot(kind);
    try{
      const headers={'Content-Type':'application/json',Authorization:'Bearer '+o.k};
      if(provider==='runway') headers['X-Runway-Version'] = '2024-11-06';
      
      const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
      if(r.ok){o.bad=0;F=Math.max(1,F*0.97);return r}
      const txt=(await r.text()).slice(0,200);log('er',kind+' HTTP '+r.status+' '+txt);
      if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;F=Math.min(4,F*1.5);err=new Error('429');continue}
      if(r.status==401||r.status==402||r.status==403){if(++o.bad>=2){o.off=true;}err=new Error('HTTP '+r.status);continue}
      if(r.status>=500||r.status==408){err=new Error('HTTP '+r.status);await sleep(2000*Math.pow(2,a));continue}
      throw Object.assign(new Error('HTTP '+r.status+' '+txt),{fatal:true});
    }catch(e){
      if(e.fatal||e.message=='stop')throw e;
      err=e;await sleep(1500*(a+1));
    }
  }
  throw err||new Error('échec');
}

/* ═════════════════════════════════════════════════════════════════════
   5. IA & JSON
   ═════════════════════════════════════════════════════════════════════ */
function J(txt){
  if(!txt)return null;
  let c=String(txt).replace(/```json|```/g,'');
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch=='\\'){o+=ch;x=true;continue}
    if(ch=='"'){s=!s;o+=ch;continue}
    if(s&&ch=='\n'){o+='\\n';continue}
    if(s&&ch=='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}
async function chat(sys,user,max,temp,imgs){
  const prov = P.provider === 'xai' ? 'xai' : 'openai';
  const models = PROVIDERS[prov].txt || PROVIDERS.xai.txt;
  const apiUrl = PROVIDERS[prov].api;
  
  for(let i=0;i<models.length;i++){
    try{
      const c=imgs&&imgs.length?[{type:'text',text:user}].concat(imgs.map(u=>({type:'image_url',image_url:{url:u}}))):user;
      const r=await call('txt',apiUrl+'/chat/completions',{model:models[i],messages:[{role:'system',content:sys},{role:'user',content:c}],temperature:temp,max_tokens:max},3,prov);
      const d=await r.json();
      const txt=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(txt)return txt;
    }catch(e){if(e.fatal||e.message=='stop')throw e;}
  }
  throw new Error('IA texte indisponible');
}
async function llmJSON(sys,user,max,temp,imgs){
  for(let a=0;a<2;a++){
    const j=J(await chat(sys+' Réponds UNIQUEMENT par un objet JSON valide, sans texte autour.',user,max,temp,imgs));
    if(j)return j;
  }
  throw new Error('JSON illisible');
}

/* ═════════════════════════════════════════════════════════════════════
   6. IMAGES
   ═════════════════════════════════════════════════════════════════════ */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{
        try{
          const s=Math.min(1,1024/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o); resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(()=>resolve(null));
  });
}
function shrinkDataUri(dataUri,maxBytes){
  maxBytes=maxBytes||6*1024*1024;
  return new Promise(resolve=>{
    if(!dataUri||dataUri.indexOf('data:')!==0)return resolve(dataUri);
    const base64=dataUri.split(',')[1]||'';
    if((base64.length*3)/4<=maxBytes)return resolve(dataUri);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,900/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>resolve(dataUri); img.src=dataUri;
  });
}
function mkImg(prompt,ratio){
  const prov = P.provider === 'openai' ? 'openai' : 'xai';
  const apiUrl = PROVIDERS[prov].api;
  const body = {model:PROVIDERS[prov].img,prompt:san(prompt),n:1,response_format:'b64_json'};
  
  if (prov === 'openai') {
    body.size = ratio === '9:16' ? '1024x1792' : ratio === '16:9' ? '1792x1024' : '1024x1024';
    body.quality = 'standard';
  } else {
    body.aspect_ratio = ratio || P.ratio || '16:9';
    body.resolution = '1k';
    body.quality = 'medium';
  }

  return call('img',apiUrl+'/images/generations',body,3,prov).then(r=>r.json()).then(d=>{
    const it=d.data&&d.data[0];
    let u=it&&it.b64_json?'data:image/png;base64,'+it.b64_json:it&&it.url;
    if(!u)throw new Error('pas d\'image');
    const img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d) img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=u;return img.d});
    return img;
  });
}

async function exportVideo() {
  const a = shots().filter(x => x.h.video || x.h.img);
  if (!a.length) return toast("Aucun média à assembler.");

  const modal = $('#exportModal'), canvas = $('#exportCanvas'), ctx = canvas.getContext('2d'), pgb = $('#exp-pgb');
  modal.classList.add('on'); pgb.style.width = '0%';
  canvas.width = 1280; canvas.height = 720;
  
  const stream = canvas.captureStream(30);
  let audioCtx, source, dest, bgAudio;
  if (P.audio) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgAudio = new Audio(P.audio); bgAudio.crossOrigin = "anonymous"; bgAudio.loop = true;
      source = audioCtx.createMediaElementSource(bgAudio);
      dest = audioCtx.createMediaStreamDestination();
      source.connect(dest); source.connect(audioCtx.destination);
      dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));
      bgAudio.play();
    } catch(e) { log('wr', 'Audio err: ' + e.message); }
  }

  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  const recorder = new MediaRecorder(stream, { mimeType: mime });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const dl = document.createElement('a'); dl.href = url; dl.download = (P.title || 'film') + '_export.' + ext; dl.click();
    if (audioCtx) audioCtx.close();
    if (bgAudio) bgAudio.pause();
    modal.classList.remove('on'); toast("✓ Film assemblé !");
  };

  recorder.start();

  try {
    for (let i = 0; i < a.length; i++) {
      const h = a[i].h;
      pgb.style.width = Math.round((i / a.length) * 100) + '%';
      
      const drawFrame = (mediaEl) => {
        const w = mediaEl.videoWidth || mediaEl.width;
        const h2 = mediaEl.videoHeight || mediaEl.height;
        const scale = Math.min(canvas.width / w, canvas.height / h2);
        const dw = w * scale, dh = h2 * scale;
        const dx = (canvas.width - dw) / 2, dy = (canvas.height - dh) / 2;
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(mediaEl, dx, dy, dw, dh);
        
        if (h.line) {
          ctx.font = "bold 36px Rajdhani, sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          const text = (h.who ? h.who + ' : ' : '') + h.line;
          const textW = ctx.measureText(text).width;
          ctx.fillRect(canvas.width/2 - textW/2 - 20, canvas.height - 100, textW + 40, 60);
          
          ctx.fillStyle = "#fff";
          ctx.fillText(text, canvas.width/2, canvas.height - 60);
        }
      };

      if (h.video) {
        const v = document.createElement('video');
        v.src = h.video; v.crossOrigin = "anonymous"; v.muted = true;
        await new Promise((resolve) => {
          v.onloadeddata = () => {
            v.play().catch(()=>{});
            const loop = () => { if (v.paused || v.ended) return resolve(); drawFrame(v); requestAnimationFrame(loop); };
            loop();
          };
          v.onerror = () => resolve();
        });
      } else if (h.img) {
        const img = new Image(); img.src = ref(h.img); img.crossOrigin = "anonymous";
        await new Promise(r => { img.onload = r; img.onerror = r; });
        const start = Date.now();
        while (Date.now() - start < 3000) { drawFrame(img); await new Promise(r => setTimeout(r, 1000/30)); }
      }
    }
    pgb.style.width = '100%'; setTimeout(() => recorder.stop(), 1000);
  } catch (e) {
    console.error(e); toast("Erreur d'exportation."); recorder.stop(); modal.classList.remove('on');
  }
}

async function task(step,title,fn,after){
  if(TASK)return;

    T.items.forEach(i=>{if(i.s=='run')i.s='er'}); T.err=e.message; render(); paintFeed(); return;
  }
  TASK=null; after();
}

async function launch(h,s){
  const provider = P.provider === 'runway' ? 'runway' : 'xai';
  const apiUrl = PROVIDERS[provider].api;
  const o=await slot('vid');
  
  let fr=h.img.u&&h.img.u.indexOf('data:')!==0?h.img.u:ref(h.img);
  if(fr&&fr.indexOf('data:')===0) fr=await shrinkDataUri(fr);
  
  let body, endpoint;
  if (provider === 'runway') {
    endpoint = apiUrl + '/image_to_video';
    body = { model: PROVIDERS.runway.vid, promptImage: fr, promptText: h.action + '. ' + h.camera, duration: 10, ratio: P.ratio };
  } else {
    endpoint = apiUrl + '/videos/generations';
    body = { model: PROVIDERS.xai.vid, prompt: h.action + '. ' + h.camera, duration: 10, aspect_ratio: P.ratio, resolution: '720p' };
    if(fr) body.image = { url: fr };
  }

  h.vst='run';h.msg='envoi…';refresh(h.id);
  let r;
  try {
    r = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+o.k, ...(provider==='runway'?{'X-Runway-Version':'2024-11-06'}:{})}, body:JSON.stringify(body) });
  } catch(e) {
    h.vst='wait'; h.err='Réseau'; refresh(h.id); return sat();
  }
  
  if(r.status==503||r.status==429){h.vst='wait';refresh(h.id);return sat()}
  if(!r.ok){h.vst='er';h.err='HTTP '+r.status;refresh(h.id);return}
  
  const d=await r.json();
  const id=d.request_id||d.id||(d.data&&(d.data.request_id||d.data.id));
  if(!id){h.vst='er';h.err='pas d\'ID';refresh(h.id);return}
  
  h.task={id:id,k:o.k,provider:provider}; Q.st='run';Q.step=0; save();qui(); poll(h);
}

async function poll(h){
  const t=h.task, end=Date.now()+30*60000;
  try{
    await sleep(5000);
    while(Date.now()<end&&P){
      let d=null;
      const url = t.provider==='runway' ? PROVIDERS.runway.api+'/tasks/'+t.id : PROVIDERS.xai.api+'/videos/'+t.id;
      try {
        const r=await fetch(url,{headers:{Authorization:'Bearer '+t.k, ...(t.provider==='runway'?{'X-Runway-Version':'2024-11-06'}:{})}});
        if(r.ok) d=await r.json();
      } catch(e) {}
      
      if(d){
        const s=String(d.status||d.state||'').toLowerCase();
        h.msg=s; refresh(h.id);
        if(['completed','succeeded','done','success'].indexOf(s)>=0){
          const u=(d.video&&d.video.url)||(d.output&&d.output[0])||d.url;
          if(!u)throw new Error('Pas d\'URL');
          h.video=u; h.vst='ok'; h.seen=false; save(); refresh(h.id); return;
        }
        if(['failed','error','cancelled'].indexOf(s)>=0) throw new Error('Échec');
      }
      await sleep(8000);
    }
  }catch(e){ h.vst='er'; h.err=e.message; save(); refresh(h.id); }
}

setInterval(function(){
  qui(); if(!P||!Q.on||Q.busy||Date.now()<Q.next)return;
  const a=shots(),todo=a.filter(x=>x.h.vst=='wait'&&x.h.img);
  if(!todo.length){if(!a.filter(x=>x.h.vst=='run').length){Q.on=false;Q.st='idle';save();qui()}return}
  Q.busy=true; launch(todo[0].h,todo[0].s).catch(e=>{Q.on=false}).then(()=>{Q.busy=false});
},1000);
function sat(){Q.st='full';Q.next=Date.now()+BACK[Q.step]*60000;Q.step=Math.min(Q.step+1,BACK.length-1);save();qui()}
function qstart(){Q.on=true;Q.st='run';Q.next=0;save();}

async function onClick(e){
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a=='go')go(+b.dataset.n);
  else if(a=='con')$('#con').classList.toggle('on');
  else if(a=='share'){
    const str = btoa(encodeURIComponent(JSON.stringify(P)));
    const url = window.location.origin + window.location.pathname + '#share=' + str;
    navigator.clipboard.writeText(url).then(()=>toast('Lien de partage copié !'));
    $('#mdc').innerHTML = '<h3>Partager le projet</h3><p>Copiez ce lien pour envoyer votre projet :</p><textarea rows="4">'+url+'</textarea><div class="rw">'+btn('closemd','Fermer')+'</div>';
    $('#md').classList.add('on');
  }
  else if(a=='closemd')$('#md').classList.remove('on');
  else if(a=='savekeys'){
    const ks=Array.from(new Set($('#keys').value.split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=8)));
    KEYS.list=ks.map(k=>mkKey(k)); KEYS.plan='standard';
    P.provider = $('[data-f="provider"]').value;
    dbPut('config',{key:'keys',list:ks}).catch(()=>{});
    go(Math.max(1,P.last||1));
  }
  else if(a=='genre'){P.genre={name:b.dataset.n,style:b.dataset.s};go(2)}
  else if(a=='synai'){task(2,'IA',async()=>{await aiSyn()},()=>done(2,'pick'))}
  else if(a=='synok'){P.final=P.syn.sugg[0];done(2,'fin')}
  else if(a=='chai'){task(3,'Persos',async()=>{await aiChars()},()=>done(3,'rev'))}
  else if(a=='nsc'){P.nsc=+b.dataset.n}
  else if(a=='scgo'){task(4,'Scènes',async()=>{await aiScenes(P.nsc)},()=>done(4,'rev'))}
  else if(a=='plgo'){task(5,'Plans',async()=>{for(let s of P.scenes)await aiShots(s)},()=>done(5,'rev'))}
  else if(a=='qstart'){qstart()}
  else if(a=='play'){
    $('#pl').classList.add('on'); const v=$('#pv'), im=$('#pi');
    for(let x of shots()){ if(x.h.video){v.src=x.h.video;v.style.display='block';im.style.display='none';await new Promise(r=>{v.onended=r;v.play().catch(r)})} else if(x.h.img){v.style.display='none';im.style.display='block';im.src=ref(x.h.img);await sleep(2000)} }
    $('#pl').classList.remove('on');
  }
  else if(a=='stopplay'){ $('#pv').pause(); $('#pl').classList.remove('on'); }
  else if(a=='exportvid')exportVideo();
  else if(a=='closeexport')$('#exportModal').classList.remove('on');
  else if(a=='del'){
    if(!confirm('Supprimer ?'))return;
    if(id.includes('-')){ const f=find(id); if(f.t=='c')P.chars=P.chars.filter(x=>x.id!=id); else if(f.t=='s')P.scenes=P.scenes.filter(x=>x.id!=id); else f.s.shots=f.s.shots.filter(x=>x.id!=id); render(true); }
  }
  else if(a=='dl'){ const f=find(id); if(f&&f.o.video){ const a=document.createElement('a'); a.href=f.o.video; a.download='plan_'+id+'.mp4'; a.click(); } }
  else if(a=='sess'){
    const l=await dbAll('sessions');
    $('#mdc').innerHTML='<h3>Mes films</h3>'+l.map(p=>'<div class="cd"><b>'+esc(p.title||'Sans titre')+'</b><button class="sm" data-a="open" data-id="'+p.id+'">Ouvrir</button></div>').join('')+'<button data-a="closemd">Fermer</button>';
    $('#md').classList.add('on');
  }
  else if(a=='open'){ const p=await dbGet('sessions',id); if(p){setP(p);$('#md').classList.remove('on');page=1;render();} }
}
document.addEventListener('click',e=>{onClick(e).catch(er=>toast('Erreur : '+er.message))});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.f||!P)return;
  const o=t.dataset.id=='P'?P:(find(t.dataset.id)||{}).o; if(!o)return;
  o[t.dataset.f]=t.dataset.arr?t.value.split(',').map(s=>s.trim()):t.value;
  save();
});
document.addEventListener('change',async e=>{
  if(e.target.id=='audio-up'){
    P.audio = URL.createObjectURL(e.target.files[0]); toast('Musique ajoutée !'); save(); render(true);
  }
});
