<script>
/* ═════════════════════════════════════════════════════════════════════

   ═════════════════════════════════════════════════════════════════════ */
const API='https://api.x.ai/v1';
const TXT=['grok-4.6','grok-3'];
const IMG='grok-imagine-image-2.0';
const VID='grok-imagine-video-1.5';
const RPM={img:20,vid:2,txt:60};
const BACK=[3,6,12,24,48,96];

const I18N = {
  fr: {

    wait: "waiting", run: "running", ok: "ready", er: "failed",
    q_ready: "Ready to create videos.", q_launch: "▶ Start video production",
    q_pause: "❚❚ Pause", q_resume: "▶ Resume production",
    q_full: "⏳ Grok queue full. Next test in", q_test: "Test now",
    q_all_ok: "🎉 All videos are ready!", q_watch: "🎬 Watch film now",
    dl_all: "⬇ Download all", export_vid: "🎥 Export film (WebM)",

    exp_close: "Close", exp_cancel: "Cancel", exp_err_cors: "Cannot assemble: videos protected by CORS."
  },
  es: {
    sub: "ESTUDIO DE CINE IA · xAI GROK", myfilms: "Mis películas", log: "Registro",
    steps: ['Claves','Género','Sinopsis','Personajes','Escenas','Planos','Videos'],
    next: "Continuar", prev: "← Atrás", step: "PASO",
    wait: "esperando", run: "en curso", ok: "listo", er: "fallido",
    q_ready: "Listo para crear videos.", q_launch: "▶ Iniciar producción de videos",
    q_pause: "❚❚ Pausar", q_resume: "▶ Reanudar producción",
    q_full: "⏳ Cola de Grok llena. Próxima prueba en", q_test: "Probar ahora",
    q_all_ok: "🎉 ¡Todos los videos están listos!", q_watch: "🎬 Ver película ahora",
    dl_all: "⬇ Descargar todo", export_vid: "🎥 Exportar película (WebM)",
    audio_bg: "🎵 Música de fondo (Opcional)", audio_add: "⬆ Añadir MP3",
    exp_loading: "Ensamblando video...", exp_wait: "No cierre esta ventana.",
    exp_close: "Cerrar", exp_cancel: "Cancelar", exp_err_cors: "No se puede ensamblar: videos protegidos por CORS."
  }
};

/* ═════════════════════════════════════════════════════════════════════
   UTILS & STATE
   ═════════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');

let db,P=null,Q=null,page=0,F=1,playing=false,TASK=null;
const KEYS={list:[],plan:'standard'};
const AR=()=>(P?P.ratio:'16:9').replace(':','/');
const ref=i=>i&&(i.d||i.u);
const mkKey=k=>({k,img:0,vid:0,txt:0,cool:0,bad:0,off:false});

// Traduction
const t = k => I18N[P?.lang || 'fr'][k] || k;

/* ═════════════════════════════════════════════════════════════════════
   STOCKAGE (IndexedDB)
   ═════════════════════════════════════════════════════════════════════ */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cinegenesis_grok',2);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'})}})}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
let mode='idb';const mem={sessions:{},config:{}},lsK=(s,k)=>'cgk_'+s+'_'+k;
function fall(e){if(mode=='idb'){mode='ls';log('wr','IndexedDB indisponible ('+(e&&e.message)+') → stockage de secours');}}
async function dbGet(s,k){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.get(k))}catch(e){fall(e)}}try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v)}catch(e){}return mem[s][k]}
async function dbPut(s,v){const k=v.key||v.id;mem[s][k]=v;if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.put(v))}catch(e){fall(e)}}try{localStorage.setItem(lsK(s,k),JSON.stringify(v))}catch(e){}}
async function dbDel(s,k){delete mem[s][k];if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.delete(k))}catch(e){fall(e)}}try{localStorage.removeItem(lsK(s,k))}catch(e){}}
async function dbAll(s){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.getAll())}catch(e){fall(e)}}const o=Object.assign({},mem[s]);try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n.startsWith(lsK(s,''))){const v=JSON.parse(localStorage.getItem(n));o[v.key||v.id]=v}}}catch(e){}return Object.values(o)}
let svT;function save(){if(!P)return;clearTimeout(svT);svT=setTimeout(()=>{P.upd=Date.now();dbPut('sessions',P).catch(e=>log('er','sauvegarde : '+e.message))},350)}

/* ═════════════════════════════════════════════════════════════════════
   LOG / TOAST
   ═════════════════════════════════════════════════════════════════════ */
function log(l,m){const d=document.createElement('div');d.className='lg '+l;d.textContent=new Date().toLocaleTimeString()+'  '+m;const b=$('#lb');if(!b)return;b.appendChild(d);while(b.children.length>400)b.firstChild.remove();b.scrollTop=b.scrollHeight}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}

/* ═════════════════════════════════════════════════════════════════════
   PLANIFICATEUR MULTI-CLÉS
   ═════════════════════════════════════════════════════════════════════ */
async function slot(kind){
  for(;;){
    if(TASK&&TASK.stop)throw new Error('stop');
    const live=KEYS.list.filter(o=>!o.off);
    if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const iv=60000/RPM[kind]*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){const t=Math.max(o[kind]||0,o.cool||0,now);if(t<bt){bt=t;best=o}}
    if(bt>now){await sleep(Math.min(bt-now,400));continue}
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;return best;
  }
}
async function call(kind,url,body,tries){
  let err;
  for(let a=0;a<tries;a++){
    const o=await slot(kind);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},body:JSON.stringify(body)});
      if(r.ok){o.bad=0;F=Math.max(1,F*0.97);return r}
      const txt=(await r.text()).slice(0,200);log('er',kind+' HTTP '+r.status+' '+txt);
      if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;F=Math.min(4,F*1.5);err=new Error('429');continue}
      if(r.status==401||r.status==402||r.status==403){if(++o.bad>=2){o.off=true;log('wr','clé …'+o.k.slice(-4)+' désactivée')}err=new Error('HTTP '+r.status);continue}
      if(r.status>=500||r.status==408){err=new Error('HTTP '+r.status);await sleep(2000*Math.pow(2,a));continue}
      throw Object.assign(new Error('HTTP '+r.status+' '+txt),{fatal:true});
    }catch(e){
      if(e.fatal||e.message=='stop')throw e;
      err=e;await sleep(1500*(a+1));
    }
  }
  throw err||new Error('échec');
}

/* ═════════════════════════════════════════════════════════════════════
   JSON & IA HELPERS
   ═════════════════════════════════════════════════════════════════════ */
function J(txt){
  if(!txt)return null;
  let c=String(txt).replace(/```json|```/g,'');
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch=='\\'){o+=ch;x=true;continue}
    if(ch=='"'){s=!s;o+=ch;continue}
    if(s&&ch=='\n'){o+='\\n';continue}
    if(s&&ch=='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}
async function chat(sys,user,max,temp,imgs){
  for(let i=0;i<TXT.length;i++){
    try{
      const c=imgs&&imgs.length?[{type:'text',text:user}].concat(imgs.map(u=>({type:'image_url',image_url:{url:u}}))):user;
      const r=await call('txt',API+'/chat/completions',{model:TXT[i],messages:[{role:'system',content:sys},{role:'user',content:c}],temperature:temp,max_tokens:max},3);
      const d=await r.json();
      const txt=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(txt)return txt;
    }catch(e){if(e.fatal||e.message=='stop')throw e;}

/* ═════════════════════════════════════════════════════════════════════
   IMAGES & VIDÉOS UTILS
   ═════════════════════════════════════════════════════════════════════ */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{
        try{
          const s=Math.min(1,1024/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o);
          resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(()=>resolve(null));
  });
}
function shrinkDataUri(dataUri,maxBytes){
  maxBytes=maxBytes||6*1024*1024;
  return new Promise(resolve=>{
    if(!dataUri||dataUri.indexOf('data:')!==0)return resolve(dataUri);
    const base64=dataUri.split(',')[1]||'';
    if((base64.length*3)/4<=maxBytes)return resolve(dataUri);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,900/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>resolve(dataUri);
    img.src=dataUri;
  });
}
function mkImg(prompt,ratio){
  const body={model:IMG,prompt:san(prompt),n:1,aspect_ratio:ratio||P.ratio||'16:9',resolution:'1k',quality:'medium',response_format:'b64_json'};
  return call('img',API+'/images/generations',body,3).then(r=>r.json()).then(d=>{
    const it=d.data&&d.data[0];
    let u=it&&it.b64_json?'data:image/png;base64,'+it.b64_json:it&&it.url;
    if(!u)throw new Error('pas d\'image');
    const img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d) img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=u;return img.d});
    return img;
  });
}
function editImg(prompt,refDataUri,ratio){
  const body={model:IMG,prompt:san(prompt),image:{url:refDataUri},aspect_ratio:ratio||P.ratio||'16:9',resolution:'1k',quality:'medium',response_format:'b64_json'};
  return call('img',API+'/images/edits',body,3).then(r=>r.json()).then(d=>{
    const it=d.data&&d.data[0];
    let u=it&&it.b64_json?'data:image/png;base64,'+it.b64_json:it&&it.url;
    if(!u)throw new Error('pas d\'image');
    return {u:u,d:u.indexOf('data:')===0?u:null};
  });
}
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d}).catch(()=>{img.d=img.u;return img.d});
  return img._conv;
}
function readFile(f,maxSide){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,maxSide/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const d=c.toDataURL('image/jpeg',0.88);res({u:d,d:d});
      };
      im.onerror=()=>res(null);im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function find(id){
  if(id=='P')return{t:'p',o:P};
  for(let i=0;i<P.chars.length;i++)if(P.chars[i].id==id)return{t:'c',o:P.chars[i]};

async function gen(id,opt){
  opt=opt||{}; const f=find(id); if(!f||f.o.busy)return;
  const o=f.o; o.busy=true;o.err='';refresh(id);
  try{
    const q=promptFor(f); let p=q.p;
    if(opt.extra)p+=' '+opt.extra+'.';
    if(opt.edit&&o.img){
      const ref=await ensureRef(o.img); if(!ref)throw new Error('ref introuvable');
      o.img=await editImg(p,await shrinkDataUri(ref),q.ratio);
    }else{ o.img=await mkImg(p,q.ratio); }
  }catch(e){ if(e.message!='stop'){o.err='Échec : '+String(e.message).slice(0,80);log('er','image : '+e.message);} }
  o.busy=false;refresh(id);save();
}
async function imgPass(list,label){
  const todo=list.filter(o=>!o.img); if(!todo.length)return;
  setTiles(list); const it=fd('Création des '+label+' (0/'+todo.length+')'); setPg(0,todo.length);
  let n=0;
  await Promise.all(todo.map(async o=>{ await gen(o.id); n++; setPg(n,todo.length); it.t='Création des '+label+' ('+n+'/'+todo.length+')'; paintFeed(); }));
  chk(); const miss=list.filter(o=>!o.img);
  if(miss.length){ it.t='Nouvel essai…'; paintFeed(); await Promise.all(miss.map(o=>gen(o.id))); chk(); }
  fdDone(it,list.filter(o=>o.img).length+'/'+list.length+' '+label+' prêt(e)s');
}

/* ═════════════════════════════════════════════════════════════════════
   ASSEMBLAGE VIDÉO (v1.1) - Export WebM
   ═════════════════════════════════════════════════════════════════════ */
async function exportVideo() {
  const a = shots().filter(x => x.h.video || x.h.img);
  if (!a.length) return toast("Aucune vidéo ou image à assembler.");

  const modal = $('#exportModal');
  const canvas = $('#exportCanvas');
  const ctx = canvas.getContext('2d');
  const pgb = $('#exp-pgb');
  
  modal.classList.add('on');
  pgb.style.width = '0%';
  
  // Configurer la taille du canvas
  canvas.width = 1280;
  canvas.height = 720;
  
  // Créer le flux depuis le canvas
  const stream = canvas.captureStream(30); // 30 fps
  
  // Gérer l'audio
  let audioCtx, source, dest;
  if (P.audio) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioEl = new Audio(P.audio);
      audioEl.crossOrigin = "anonymous";
      source = audioCtx.createMediaElementSource(audioEl);
      dest = audioCtx.createMediaStreamDestination();
      source.connect(dest);
      source.connect(audioCtx.destination); // pour entendre pendant l'export
      
      // Ajouter la piste audio au flux vidéo
      dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));
      
      // Jouer l'audio en boucle
      audioEl.loop = true;
      audioEl.play().catch(e => console.warn("Audio bloqué par le navigateur", e));
    } catch(e) {
      log('wr', 'Impossible d\'initialiser l\'audio: ' + e.message);
    }
  }

  // Configurer l'enregistreur
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const dl = document.createElement('a');
    dl.href = url;
    dl.download = (P.title || 'film') + '_export.webm';
    dl.click();
    
    // Nettoyage
    if (audioCtx) audioCtx.close();
    modal.classList.remove('on');
    toast("✓ Vidéo assemblée avec succès !");
  };

  recorder.start();

  // Boucle de dessin
  try {
    for (let i = 0; i < a.length; i++) {
      const h = a[i].h;
      pgb.style.width = Math.round((i / a.length) * 100) + '%';
      
      if (h.video) {
        // Créer un élément vidéo temporaire pour la lecture
        const v = document.createElement('video');
        v.src = h.video;
        v.crossOrigin = "anonymous"; // Important pour éviter canvas tainted
        v.muted = true;
        
        await new Promise((resolve, reject) => {
          v.onloadeddata = () => {
            v.play().catch(reject);
            const drawLoop = () => {
              if (v.paused || v.ended) return resolve();
              // Remplir le canvas en gardant le ratio
              const scale = Math.min(canvas.width / v.videoWidth, canvas.height / v.videoHeight);
              const w = v.videoWidth * scale;
              const h2 = v.videoHeight * scale;
              const x = (canvas.width - w) / 2;
              const y = (canvas.height - h2) / 2;
              ctx.fillStyle = "#000";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(v, x, y, w, h2);
              requestAnimationFrame(drawLoop);
            };
            drawLoop();
          };
          v.onerror = () => {
            log('er', 'Erreur CORS sur une vidéo');
            resolve(); // On continue quand même
          };
        });
      } else if (h.img) {
        // Afficher l'image pendant 3 secondes
        const img = new Image();
        img.src = ref(h.img);
        await new Promise(resolve => {
          img.onload = () => resolve();
          img.onerror = () => resolve();
        });
        
        const startTime = Date.now();
        while (Date.now() - startTime < 3000) {
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
          const w = img.width * scale;
          const h2 = img.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h2) / 2;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, x, y, w, h2);
          await new Promise(r => setTimeout(r, 1000 / 30)); // 30fps
        }
      }
    }
    
    pgb.style.width = '100%';
    setTimeout(() => recorder.stop(), 1000); // Laisser 1s de marge

  } catch (e) {
    console.error(e);
    toast(t('exp_err_cors'));
    recorder.stop();
    modal.classList.remove('on');
  }
}

/* ═════════════════════════════════════════════════════════════════════
   TÉLÉCHARGEMENT INDIVIDUEL
   ═════════════════════════════════════════════════════════════════════ */
function fileNum(h){ return String(shots().findIndex(x=>x.h===h)+1).padStart(2,'0'); }
function baseName(){ return (P.title||'film').replace(/[^\w\-]+/g,'_').slice(0,40)||'film'; }

async function downloadVideo(h){
  if(!h||!h.video)return toast('Aucune vidéo.');
  const name=baseName()+'_plan-'+fileNum(h)+'.mp4';
  toast('Préparation…');
  try{
    const r=await fetch(h.video,{mode:'cors'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const blob=await r.blob();
    const file=new File([blob],name,{type:'video/mp4'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: 'Enregistrer la vidéo'});
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url;a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
  }catch(e){
    if(e.name === 'AbortError') return;
    const a=document.createElement('a'); a.href=h.video;a.download=name;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
  }
}

function fd(txt){const it={t:txt,s:'run',at:Date.now()};TASK.items.push(it);paintFeed();return it}
function fdDone(it,txt){it.s='ok';if(txt)it.t=txt;paintFeed()}
function paintFeed(){const e=$('#feed');if(!e||!TASK)return;const n=Date.now();e.innerHTML=TASK.items.map(i=>'<div class="fi '+i.s+'"><span class="ic">'+(i.s=='ok'?'✓':i.s=='er'?'✕':'<i class="sp2"></i>')+'</span><span>'+esc(i.t)+'</span>'+(i.s=='run'?'<em>'+Math.round((n-i.at)/1000)+' s</em>':'')+'</div>').join('')}
function setPg(d,t){if(!TASK)return;TASK.pg=[d,t];pgb()}
function pgb(){const b=$('#pgb');if(b&&TASK&&TASK.pg)b.style.width=Math.round(TASK.pg[0]/Math.max(1,TASK.pg[1])*100)+'%'}
function setTiles(l){TASK.tiles=l;const e=$('#tiles');if(e)e.innerHTML=l.map(mini).join('')}
const chk=()=>{if(TASK&&TASK.stop)throw new Error('stop')};

function workView(){
  const T=TASK;
  return '<div class="hero"><div class="lab">'+t('step')+' '+(T.step+1)+' / 7</div><h2>'+esc(T.title)+'</h2>'+
    (T.err?'<div class="guide er"><b>Erreur :</b> '+esc(T.err)+'<div class="rw" style="margin-top:8px">'+btn('retrytask','Réessayer','big')+btn('canceltask','← Retour')+'</div></div>'
         :'<div class="guide wt"><i class="sp2"></i><div><b>L\'IA travaille...</b><div class="lab">Temps : <span id="el">0 s</span></div></div></div>')+
    '<div class="bar"><i id="pgb"></i></div><div id="feed" class="feed"></div><div class="grid mg" id="tiles">'+((T.tiles||[]).map(mini).join(''))+'</div>'+
    (T.err?'':'<div class="ft"><span></span>'+btn('stoptask','■ Arrêter')+'</div>')+'</div>';
}
async function task(step,title,fn,after){
  if(TASK)return;
  TASK={step:step,title:title,fn:fn,after:after,items:[],start:Date.now(),stop:false,err:null,pg:null,tiles:null};
  page=step;render();
  try{await fn();chk();}
  catch(e){
    const T=TASK;
    if(e.message=='stop'){TASK=null;toast('Arrêté');render();return;}
    T.items.forEach(i=>{if(i.s=='run')i.s='er'}); T.err=e.message; log('er',title+' : '+e.message);
    render(); paintFeed(); return;
  }
  TASK=null; after();
}
function retryTask(){const T=TASK;if(!T||!T.err)return;TASK=null;task(T.step,T.title,T.fn,T.after)}
setInterval(()=>{if(!TASK||TASK.err)return;const e=$('#el');if(e)e.textContent=Math.round((Date.now()-TASK.start)/1000)+' s';paintFeed()},1000);

function go(n){if(TASK)return;if(page>0)P.last=page;page=n;render();onEnter()}
function done(step,sub){P.sub[step]=sub;save();render()}
function onEnter(){
  if(TASK||!P)return;
  const s=P.sub[page]||(page==2?'in':'cfg');
  if(s!='cfg')return;
  if(page==3)runChars(P.chars.length?'own':'ai');
  else if(page==4)runScenes(P.nsc||5);
  else if(page==5)runShots();
}

const CTX=()=>'Genre : '+P.genre.name+' ('+P.genre.style+').';

async function aiSyn(){
  const j=await llmJSON('Script doctor et scénariste de films d\'auteur.',
    CTX()+'\nSynopsis de l\'auteur :\n"""'+P.synRaw+'"""\nRéponds : {"title":"titre du film","base":"le synopsis de l\'auteur réécrit avec soin, fidèle à ses idées, en français, 5 à 8 phrases","suggestions":["10 synopsis alternatifs, chacun 3 à 5 phrases en français"]}',4500,0.8);
  if(!j.base||!Array.isArray(j.suggestions))throw new Error('format inattendu');
  P.title=P.title||String(j.title||'');
  P.syn={base:String(j.base),sugg:j.suggestions.map(String).slice(0,10),sel:[]};
}
async function aiMerge(){
  const s=P.syn.sel.map(i=>P.syn.sugg[i]);
  const j=await llmJSON('Scénariste. Fusionne sans perdre la cohérence.',
    'Base :\n'+P.syn.base+'\n\nIdées :\n'+s.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nÉcris UN synopsis final cohérent (8 à 12 phrases). {"final":"..."}',3000,0.6);
  P.final=String(j.final||P.syn.base);
}
async function aiChars(){
  const j=await llmJSON('Directeur de casting et chef costumier.',
    CTX()+'\nSynopsis :\n'+P.final+'\nPropose 3 à 6 personnages principaux. {"characters":[{"name":"","role":"rôle en français","desc":"English physical description","outfit":"English costume"}]}',3500,0.7);
  const cs=j.characters||[];
  if(!cs.length)throw new Error('aucun personnage');
  cs.forEach(c=>P.chars.push({id:uid(),name:String(c.name||'?'),role:String(c.role||''),desc:String(c.desc||''),outfit:String(c.outfit||''),img:null,busy:false}));
}
async function aiScenes(n){
  const j=await llmJSON('Scénariste de cinéma d\'auteur.',
    CTX()+'\nTitre : '+P.title+'\nSynopsis :\n'+P.final+'\nPersonnages :\n'+P.chars.map(c=>c.name+' : '+c.role).join('\n')+'\nÉcris exactement '+n+' scènes. {"scenes":[{"title":"","summary":"2-3 phrases en français","decor":"English place description","mood":"English mood","chars":["noms"],"dialogue":[{"who":"","line":"réplique courte en français"}]}]}',7000,0.75);
  const sc=j.scenes||[];
  if(!sc.length)throw new Error('aucune scène');
  P.scenes=sc.map(s=>({id:uid(),title:String(s.title||''),summary:String(s.summary||''),decor:String(s.decor||''),mood:String(s.mood||''),chars:Array.isArray(s.chars)?s.chars.map(String):[],dialogue:(s.dialogue||[]).map(d=>(d.who||'')+': '+(d.line||'')).join('\n'),img:null,busy:false,shots:[]}));
}
async function aiShots(s){
  const j=await llmJSON('Réalisateur et chef opérateur.',
    CTX()+'\nScène : '+s.title+'. '+s.summary+'\nDécor : '+s.decor+'. Ambiance : '+s.mood+'.\nPersonnages : '+(s.chars||[]).join(', ')+'\nDialogues :\n'+s.dialogue+'\nDécoupe en 3 à 5 plans. {"shots":[{"size":"wide|medium|close-up","camera":"English camera movement","action":"English visual description","chars":["noms"],"who":"","line":"réplique en français ou vide"}]}',3500,0.7);
  const a=j.shots||[];
  if(!a.length)throw new Error('aucun plan');
  s.shots=a.map(h=>({id:uid(),size:String(h.size||'medium'),camera:String(h.camera||'static'),action:String(h.action||''),chars:Array.isArray(h.chars)?h.chars.map(String):[],who:String(h.who||''),line:String(h.line||''),img:null,busy:false,vst:'wait'}));
}
async function aiDescribe(c){
  const j=await llmJSON('Directeur de casting.','Décris cette personne. {"desc":"English physical description","outfit":"English clothing"}',500,0.2,[ref(c.img)]);
  c.desc=String(j.desc||c.desc); c.outfit=String(j.outfit||c.outfit);
}

   ═════════════════════════════════════════════════════════════════════ */
function runSyn(){ task(2,'Analyse du synopsis',async()=>{ const b=fd('Réécriture…'); await aiSyn(); chk(); fdDone(b,'Synopsis prêt'); },()=>done(2,'pick')); }
function runMerge(){ task(2,'Fusion',async()=>{ const a=fd('Fusion des choix…'); await aiMerge(); chk(); fdDone(a,'Synopsis final écrit'); },()=>done(2,'fin')); }
function runChars(m){
  let ai=(m=='ai');
  task(3,'Création des personnages',async()=>{
    if(ai){ const a=fd('Création…'); await aiChars(); ai=false;chk(); fdDone(a,'Personnages prêts'); }
    for(const c of P.chars.filter(c=>c.img&&!c.desc)){
      const d=fd('Analyse de '+c.name+'…');
      try{await aiDescribe(c)}catch(e){if(e.message=='stop')throw e}
      fdDone(d,'Photo analysée');
    }
    await imgPass(P.chars,'portraits');
  },()=>done(3,'rev'));
}
function runScenes(n){
  let w=true;
  task(4,'Écriture du scénario',async()=>{
    if(w){ const a=fd('Écriture…'); await aiScenes(n); w=false;chk(); fdDone(a,P.scenes.length+' scènes écrites'); }
    await imgPass(P.scenes,'images de scènes');
  },()=>done(4,'rev'));
}
function runShots(){
  task(5,'Découpage et images',async()=>{
    const todo=P.scenes.filter(s=>!(s.shots||[]).length);
    if(todo.length){
      const a=fd('Découpage…'); let k=0;
      await Promise.all(todo.map(async s=>{ try{await aiShots(s)}catch(e){if(e.message=='stop')throw e} k++; a.t='Découpage ('+k+'/'+todo.length+')…'; paintFeed(); }));
      chk(); fdDone(a,'Scènes découpées');
    }
    if(!shots().length)throw new Error('Aucun plan');
    await imgPass(shots().map(x=>x.h),'images de plans');
  },()=>done(5,'rev'));
}

async function launch(h,s){
  const o=await slot('vid');
  let fr=h.img.u&&h.img.u.indexOf('data:')!==0?h.img.u:ref(h.img);
  if(fr&&fr.indexOf('data:')===0) fr=await shrinkDataUri(fr);
  
  const body={model:VID,prompt:vp(h,s),duration:10,aspect_ratio:P.ratio,resolution:'720p'};
  if(fr)body.image={url:fr};
  
  h.vst='run';h.msg='envoi…';h.err='';refresh(h.id);
  let r;
  try{ r=await fetch(API+'/videos/generations',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},body:JSON.stringify(body)}); }
  catch(e){ h.vst='wait';h.err='Réseau';Q.next=Date.now()+30000;refresh(h.id);return; }
  
  if(r.status==503){await r.text();h.vst='wait';refresh(h.id);return sat()}
  if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||30)*1000;h.vst='wait';refresh(h.id);return}
  if(!r.ok){ const txt=(await r.text().catch(()=>'')).slice(0,140);h.vst='er';h.err='HTTP '+r.status;log('er','vidéo '+h.err);refresh(h.id);return; }
  
  const d=await r.json();
  const id=d.request_id||d.id||(d.data&&(d.data.request_id||d.data.id));
  if(!id){h.vst='er';h.err='pas de request_id';refresh(h.id);return}
  h.task={id:id,k:o.k}; Q.st='run';Q.step=0;
  save();qui(); poll(h);
}

async function poll(h){
  const t=h.task,end=Date.now()+30*60000; let n=0,miss=0;
  try{
    await sleep(5000);
    while(Date.now()<end&&P){
      const iv=Math.min(20000,5000+n*1500);n++; let d=null;
      try{
        const r=await fetch(API+'/videos/'+encodeURIComponent(t.id),{headers:{Authorization:'Bearer '+t.k}});
        if(r.status==429){await sleep(8000);continue}
        if(r.ok) d=await r.json(); else miss++;
      }catch(e){miss++}
      
      if(d){
        const s=String(d.status||d.state||'').toLowerCase();
        h.msg=d.progress?d.progress+'%':s; refresh(h.id);
        if(['completed','succeeded','done','success','finished','ready'].indexOf(s)>=0){
          const u=(d.video&&(d.video.url||d.video.video_url))||(d.output&&(d.output.url||d.output.video_url))||(d.data&&(d.data.url||d.data.video_url))||d.url||d.video_url;
          if(!u)throw new Error('terminé sans URL');
          h.video=u;h.vst='ok';h.seen=false;h.err=''; save();refresh(h.id); return;
        }
        if(['failed','error','cancelled','canceled','rejected'].indexOf(s)>=0) throw new Error('échec génération');
      }else if(miss>20)throw new Error('suivi impossible');
      await sleep(iv);
    }
    throw new Error('délai dépassé');
  }catch(e){
    h.vst='er';h.err=e.message; save();refresh(h.id);
  }
}

setInterval(function(){
  qui(); if(!P||!Q.on||Q.busy||Date.now()<Q.next)return;
  const a=shots(),todo=a.filter(x=>x.h.vst=='wait'&&x.h.img),run=a.filter(x=>x.h.vst=='run').length,live=KEYS.list.filter(k=>!k.off).length;
  if(!todo.length){if(!run){Q.on=false;Q.st='idle';save();qui()}return}
  if(run>=Math.max(2,live*3))return;
  Q.busy=true; const next=todo[0];
  launch(next.h,next.s).catch(e=>{Q.on=false;Q.st='paused'}).then(()=>{Q.busy=false});
},1000);

function qstart(){
  if(!shots().some(x=>x.h.img))return toast('Il faut des images de plans');
  Q.on=true; if(Q.st=='paused'||Q.st=='idle')Q.st='run';
  if(Q.st!='full')Q.next=0; save();qui();
}

/* ═════════════════════════════════════════════════════════════════════
   LECTEUR
   ═════════════════════════════════════════════════════════════════════ */
function speak(txt){
  if(!txt||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt); u.lang='fr-FR';
  speechSynthesis.speak(u);
}
async function play(){
  const a=shots().filter(x=>x.h.video||x.h.img);
  if(!a.length)return toast('Vide');
  playing=true; $('#pl').classList.add('on');
  const v=$('#pv'),im=$('#pi');
  
  // Gérer la musique de fond locale
  let bgAudio = null;
  if (P.audio) {
    bgAudio = new Audio(P.audio);
    bgAudio.loop = true;
    bgAudio.volume = 0.3; // Musique plus discrète que la voix
    bgAudio.play().catch(e=>console.log('Audio bloqué', e));
  }

  for(let i=0;i<a.length;i++){
    if(!playing)break;
    const h=a[i].h;
    $('#sub').textContent=h.line?(h.who?h.who+' : ':'')+h.line:'';
    
    if(h.video){
      im.style.display='none';v.style.display='block';
      v.src=h.video;
      await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r)});
      h.seen=true;
    }else{
      v.style.display='none';im.style.display='block';
      im.src=ref(h.img); speak(h.line);
      await sleep(Math.max(3500,(h.line||'').length*75));
    }
  }
  
  if (bgAudio) bgAudio.pause();
  stopPlay();save();
}
function stopPlay(){
  playing=false; $('#pv').pause();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  $('#pl').classList.remove('on');
  if(page==6&&!TASK)render(true);
}

/* ═════════════════════════════════════════════════════════════════════
   ACTIONS
   ═════════════════════════════════════════════════════════════════════ */
function changeLang(l) {
  P.lang = l;
  save();
  render(true);
}

const OK_DURING=['con','stoptask','retrytask','canceltask','closemd'];
function redo(n){
  if(!confirm('Refaire ?'))return;
  if(n==3)P.chars=[]; if(n==4)P.scenes=[]; if(n==5)P.scenes.forEach(s=>s.shots=[]);
  P.sub[n]='cfg'; render();
  if(n==5)runShots(); else onEnter();
}

async function onClick(e){
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(TASK&&OK_DURING.indexOf(a)<0)return toast('Patientez ou Arrêtez l\'opération en cours.');
  
  if(a=='go')go(+b.dataset.n);
  else if(a=='con')$('#con').classList.toggle('on');
  else if(a=='closemd')$('#md').classList.remove('on');
  else if(a=='savekeys'){
    const ks=Array.from(new Set($('#keys').value.split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=8)));
    if(!ks.length)return toast('Clés invalides');
    KEYS.plan='standard';
    KEYS.list=ks.map(k=>{ const old=KEYS.list.find(o=>o.k==k); return old||mkKey(k); });
    dbPut('config',{key:'keys',list:ks,plan:KEYS.plan}).catch(er=>log('wr','clés : '+er.message));
    go(Math.max(1,P.last||1));
  }
  else if(a=='genre'){P.genre={name:b.dataset.n,style:b.dataset.s};render(true)}
  else if(a=='ratio'){P.ratio=b.dataset.n;render(true)}
  else if(a=='synai'){if((P.synRaw||'').trim().length<10)return toast('Écrivez plus');runSyn()}
  else if(a=='synasis'){if((P.synRaw||'').trim().length<10)return toast('Écrivez plus');P.final=P.synRaw;P.syn=null;done(2,'fin')}
  else if(a=='synedit'){P.syn=null;P.final='';P.sub[2]='in';render()}
  else if(a=='synback'){P.sub[2]=P.syn?'pick':'in';render()}
  else if(a=='synok'){
    if((P.syn.sel||[]).length)runMerge();
    else{P.final=P.syn.base;P.sub[2]='fin';render()}
  }
  else if(a=='chai')runChars('ai');
  else if(a=='chown')runChars('own');
  else if(a=='addchar'){P.chars.push({id:uid(),name:'Nouveau',role:'',desc:'',outfit:'',img:null,busy:false});render(true);scrollTo(0,document.body.scrollHeight)}
  else if(a=='nsc'){P.nsc=+b.dataset.n;render(true)}
  else if(a=='scgo'){if(P.scenes.length&&!confirm('Remplacer ?'))return;runScenes(P.nsc||5)}
  else if(a=='plgo')runShots();
  else if(a=='addscene'){P.scenes.push({id:uid(),title:'Nouvelle',summary:'',decor:'',mood:'',chars:[],dialogue:'',img:null,busy:false,shots:[]});render(true)}
  else if(a=='addshot'){const f=find(id);if(f){const s=f.o;(s.shots=s.shots||[]).push({id:uid(),size:'medium',camera:'static',action:'',chars:[],who:'',line:'',img:null,busy:false,vst:'wait'});render(true)}}
  else if(a=='redo')redo(+b.dataset.n);
  else if(a=='gen'){const i=document.querySelector('[data-mod="'+id+'"]');gen(id,{extra:i&&i.value.trim()})}
  else if(a=='mod'){
    const i=document.querySelector('[data-mod="'+id+'"]');
    if(i&&i.value.trim())gen(id,{edit:true,extra:i.value.trim()});
    else toast('Écrivez une demande');
  }
  else if(a=='del'){
    if(!confirm('Supprimer ?'))return;
    const f=find(id); if(!f)return;
    if(f.t=='c')P.chars=P.chars.filter(c=>c.id!=id);
    else if(f.t=='s')P.scenes=P.scenes.filter(s=>s.id!=id);
    else f.s.shots=f.s.shots.filter(h=>h.id!=id);
    render(true);
  }
  else if(a=='stoptask'){TASK.stop=true;toast('Arrêt…')}
  else if(a=='retrytask')retryTask();
  else if(a=='canceltask'){TASK=null;render()}
  else if(a=='qstart')qstart();
  else if(a=='qpause'){Q.on=false;Q.st='paused';save();qui()}
  else if(a=='qnow'){Q.on=true;Q.next=0;save()}
  else if(a=='retry'){const f=find(id);f.o.vst='wait';f.o.err='';Q.on=true;if(Q.st=='paused')Q.st='run';refresh(id);qui()}
  else if(a=='play')play();
  else if(a=='stopplay')stopPlay();
  else if(a=='exportvid')exportVideo();
  else if(a=='closeexport')$('#exportModal').classList.remove('on');
  else if(a=='dl'){const f=find(id);if(f)downloadVideo(f.o)}
  else if(a=='dlall'){
    const a=shots().filter(x=>x.h.video);
    if(!a.length)return toast('Vide');
    if(navigator.userAgent.match(/iPhone|iPad|iPod/i))return toast('Sur iOS, téléchargez un par un.');
    for(let i=0;i<a.length;i++){ await downloadVideo(a[i].h); await sleep(700); }
  }
  else if(a=='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));
    const l=document.createElement('a'); l.href=u;l.download=(P.title||'film')+'.json';l.click();
  }
  else if(a=='sess')sessions();
  else if(a=='new'){setP(newP());$('#md').classList.remove('on');page=KEYS.list.length?1:0;render()}
  else if(a=='open'){ const p=await dbGet('sessions',id); if(p){setP(p);page=KEYS.list.length?Math.max(1,Math.min(p.page||1,6)):0;$('#md').classList.remove('on');render();resume()} }
  else if(a=='delsess'){ if(!confirm('Supprimer ?'))return; await dbDel('sessions',id); if(P.id==id){setP(newP());page=KEYS.list.length?1:0;render()} sessions(); }
}

document.addEventListener('click',e=>{onClick(e).catch(er=>{log('er','action : '+er.message);toast('Erreur : '+er.message)})});
window.addEventListener('error',e=>{log('er',e.message)});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.f||!P)return;
  const o=t.dataset.id=='P'?P:(find(t.dataset.id)||{}).o; if(!o)return;
  if(t.dataset.arr) o[t.dataset.f]=t.value.split(',').map(s=>s.trim()).filter(Boolean);
  else o[t.dataset.f]=t.value;
  save();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.sg!==undefined){
    const i=+t.dataset.sg,s=P.syn.sel=P.syn.sel||[];
    if(t.checked){if(s.indexOf(i)<0)s.push(i)}else P.syn.sel=s.filter(x=>x!=i);
    save();
  } else if(t.dataset.up){
    const f=t.files[0]; if(!f)return;
    const o=find(t.dataset.up); if(!o)return;
    const im=await readFile(f,1024); if(!im)return toast('Illisible');
    o.o.img=im;o.o.err='';
    if(o.t=='c'){ o.o.busy=true;refresh(o.o.id); try{await aiDescribe(o.o)}catch(er){} o.o.busy=false; }
    refresh(o.o.id);save();
  } else if(t.id=='audio-up'){
    const f=t.files[0]; if(!f)return;
    P.audio = URL.createObjectURL(f);
    toast('Musique de fond ajoutée !');
    save(); render(true);
  }
});
document.addEventListener('play',e=>{
  const v=e.target;
  if(v.dataset&&v.dataset.id){
    const f=find(v.dataset.id);
    if(f&&!f.o.seen){ f.o.seen=true; const n=v.parentNode.querySelector('.nw'); if(n)n.remove(); save();stats(); }
  }
},true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&playing)stopPlay()});

async function sessions(){
  const l=(await dbAll('sessions')).sort((a,b)=>b.upd-a.upd);
  $('#mdc').innerHTML='<h3>Mes films</h3><div class="rw">'+btn('new','+ Nouveau','big')+btn('closemd','Fermer')+'</div>'+
    l.map(p=>{
      const sh=p.scenes.flatMap(s=>s.shots||[]);
      const nv=sh.filter(h=>h.video&&!h.seen).length;
      return '<div class="cd" style="margin-top:8px"><b>'+esc(p.title||'Sans titre')+'</b>'+(p.id==P.id?' · <span class="lab">en cours</span>':'')+
        '<div class="lab">'+new Date(p.upd).toLocaleString()+' · '+p.scenes.length+' scènes · '+sh.filter(h=>h.video).length+' vidéos'+(nv?' · '+nv+' NEW':'')+'</div>'+
        '<div class="rw">'+btn('open','Ouvrir','sm','data-id="'+p.id+'"')+btn('delsess','Suppr','sm','data-id="'+p.id+'"')+'</div></div>';
    }).join('');
  $('#md').classList.add('on');
}
$('#md').addEventListener('click',e=>{if(e.target.id=='md')e.target.classList.remove('on')});

/* ═════════════════════════════════════════════════════════════════════
   INITIALISATION
   ═════════════════════════════════════════════════════════════════════ */
function resume(){
  shots().forEach(x=>{ if(x.h.vst=='run'&&x.h.task){ if(KEYS.list.some(k=>k.k==x.h.task.k))poll(x.h); else x.h.vst='wait'; } });
  qui();
}
(async()=>{
  try{db=await Promise.race([openDB(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),3000))])}catch(e){db=null;fall(e)}
  try{
    const k=await dbGet('config','keys');
    if(k){KEYS.plan='standard';KEYS.list=(k.list||[]).map(mkKey)}
    const last=await dbGet('config','last'),p=last&&await dbGet('sessions',last.v);
    setP(p||newP());
  }catch(e){setP(newP())}
  page=KEYS.list.length?Math.max(1,Math.min(P.page||1,6)):0;
  render(); resume();
  log('in','CINÉ-GENESIS v1.1 prêt.');
  if(KEYS.list.length)onEnter();
})();
</script></body></html>
